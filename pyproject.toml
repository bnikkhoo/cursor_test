[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pfa-intake"
version = "0.1.0"
description = "Pacific Flight Academy document intake engine (sidecar; does not modify live Grok bots)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
pfa-intake = "pfa_intake.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pfa_intake*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
